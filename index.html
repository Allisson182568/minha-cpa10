<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPA-10 CLOUD ULTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .view { display: none; }
        .active { display: block; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <div class="max-w-md mx-auto w-full space-y-4 flex-grow">
        <header class="flex justify-between items-center px-2 py-4">
            <div>
                <h1 class="text-2xl font-900 tracking-tighter text-blue-500 italic">CPA10<span class="text-white">ULTRA</span></h1>
                <p id="voz-name" class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Sincronizando...</p>
            </div>
            <div id="sync-indicator" class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-bold text-gray-400">SUPABASE</span>
            </div>
        </header>

        <div id="dash" class="view active space-y-4">
            <div class="glass p-8 rounded-[40px] text-center shadow-2xl border-b-2 border-blue-500/50">
                <p class="text-[10px] text-blue-400 font-black uppercase tracking-[0.2em] mb-4">Progresso de Aprendizado</p>
                <div class="text-6xl font-900 mb-4 tracking-tighter" id="progresso-txt">0/0</div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="progresso-bar" class="bg-blue-500 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-5 rounded-3xl border-t-2 border-yellow-500/30">
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">Dias para a Prova</p>
                    <p id="days-countdown" class="text-2xl font-black text-yellow-500">--</p>
                </div>
                <div class="glass p-5 rounded-3xl text-right">
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">Data Agendada</p>
                    <p id="data-prova-txt" class="text-sm font-bold text-white italic">Não agendada</p>
                </div>
            </div>

            <div class="glass p-5 rounded-3xl flex justify-between items-center">
                <span class="text-[10px] text-gray-500 font-bold uppercase">Status de Inscrição</span>
                <span class="text-[10px] bg-green-500/20 text-green-500 px-2 py-1 rounded-md font-bold uppercase tracking-tight">Pago / Confirmado</span>
            </div>
        </div>

        <div id="prova" class="view space-y-4">
            <div class="flex justify-between items-center px-1">
                <span class="text-[10px] font-black text-yellow-500 bg-yellow-500/10 px-3 py-1 rounded-full">SIMULADO REAL</span>
                <div id="timer" class="text-2xl font-black text-yellow-500 font-mono">180s</div>
            </div>
            <div class="glass p-8 rounded-[32px] min-h-[160px] flex items-center shadow-2xl">
                <p id="q-txt" class="text-lg font-bold leading-tight">Clique na aba para gerar questão.</p>
            </div>
            <div id="opts-container" class="space-y-3"></div>
        </div>

        <div id="maratona" class="view space-y-6 text-center">
            <div class="glass p-12 rounded-[56px] relative shadow-inner">
                <div id="pulse-ring" class="hidden absolute inset-0 rounded-[56px] border-4 border-blue-500/30 animate-ping"></div>
                <button onclick="toggleMaratona()" id="btn-maratona" class="btn-press relative z-10 w-28 h-28 bg-blue-600 rounded-full text-4xl shadow-xl flex items-center justify-center mx-auto">▶️</button>
                <h2 class="mt-8 font-black text-2xl uppercase tracking-tighter">Modo Direção</h2>
                <p class="text-gray-500 text-[10px] mt-2 font-bold uppercase tracking-widest italic">5s de Reflexão</p>
            </div>
            <div class="bg-blue-900/10 p-6 rounded-3xl border border-blue-500/10 min-h-[100px] flex items-center justify-center">
                <p id="current-q" class="text-sm text-blue-300 font-medium leading-relaxed italic">Aguardando início...</p>
            </div>
        </div>
    </div>

    <nav class="max-w-md mx-auto w-full glass p-4 rounded-[32px] flex justify-around mb-6 shadow-2xl">
        <button onclick="showView('dash')" class="btn-press text-2xl">📊</button>
        <button onclick="showView('prova')" class="btn-press text-2xl">🧪</button>
        <button onclick="showView('maratona')" class="btn-press text-2xl">🎧</button>
    </nav>

<script>
const SB_URL = "https://wfoysxuynbcuxybkqmfz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmb3lzeHV5bmJjdXh5YmtxbWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3OTk3NDcsImV4cCI6MjA4ODM3NTc0N30.v28Tj6z6PrnyUk_kFSvvchjzwHmV7ZXcJH903hQTiZg";
const supabase = window.supabase.createClient(SB_URL, SB_KEY);

let app = { idx: 0, playing: false, questions: [], voice: null, userId: 'allisson' };

// INICIALIZAÇÃO
async function init() {
    // Busca progresso e questões
    const [progRes, qsRes] = await Promise.all([
        supabase.from('cpa10_progresso').select('*').eq('user_id', app.userId).single(),
        supabase.from('cpa10_maratona').select('*').order('id', { ascending: true })
    ]);

    if(progRes.data) {
        app.idx = progRes.data.maratona_idx || 0;
        if(progRes.data.data_prova) updateCountdown(progRes.data.data_prova);
    }
    
    app.questions = qsRes.data || [];
    updateUI();
    initVoice();
}

// NAVEGAÇÃO ENTRE ABAS
function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    
    if(viewId === 'prova') startSimulado();
    if(viewId !== 'maratona' && app.playing) toggleMaratona(); // Para o áudio se sair da aba
}

// LÓGICA DE ÁUDIO (MARATONA)
function initVoice() {
    const voices = window.speechSynthesis.getVoices();
    app.voice = voices.find(v => v.lang.includes('pt')) || voices[0];
    if(app.voice) document.getElementById('voz-name').innerText = "Voz: " + app.voice.name.split(' ')[0];
}
window.speechSynthesis.onvoiceschanged = initVoice;

async function toggleMaratona() {
    if(app.questions.length === 0) return alert("Suba o CSV no Supabase primeiro!");
    
    app.playing = !app.playing;
    document.getElementById('btn-maratona').innerText = app.playing ? "⏸️" : "▶️";
    document.getElementById('pulse-ring').classList.toggle('hidden', !app.playing);
    
    if(app.playing) runMaratona();
    else window.speechSynthesis.cancel();
}

async function runMaratona() {
    if(!app.playing || app.idx >= app.questions.length) return;

    let q = app.questions[app.idx];
    document.getElementById('current-q').innerText = q.pergunta;

    await speak(q.pergunta);
    await new Promise(r => setTimeout(r, 5000)); // 5s de reflexão
    
    if(!app.playing) return;
    await speak("Resposta: " + q.resposta);
    
    app.idx++;
    updateUI();
    saveProgress();
    setTimeout(runMaratona, 2000);
}

function speak(text) {
    return new Promise(resolve => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.voice = app.voice;
        u.onend = resolve;
        window.speechSynthesis.speak(u);
    });
}

// PERSISTÊNCIA E UI
async function saveProgress() {
    const indicator = document.getElementById('sync-indicator').firstElementChild;
    indicator.classList.replace('bg-green-500', 'bg-yellow-500');
    
    await supabase.from('cpa10_progresso').update({ maratona_idx: app.idx }).eq('user_id', app.userId);
    
    setTimeout(() => indicator.classList.replace('bg-yellow-500', 'bg-green-500'), 500);
}

function updateCountdown(dataStr) {
    const prova = new Date(dataStr);
    const hoje = new Date();
    const diff = Math.ceil((prova - hoje) / (1000 * 60 * 60 * 24));
    document.getElementById('days-countdown').innerText = diff > 0 ? diff + "d" : "HOJE!";
    document.getElementById('data-prova-txt').innerText = prova.toLocaleDateString('pt-BR');
}

function updateUI() {
    const total = app.questions.length || 0;
    const pct = total > 0 ? (app.idx / total) * 100 : 0;
    document.getElementById('progresso-bar').style.width = pct + "%";
    document.getElementById('progresso-txt').innerText = `${app.idx}/${total}`;
}

function startSimulado() {
    if(app.questions.length === 0) return;
    const q = app.questions[Math.floor(Math.random() * app.questions.length)];
    document.getElementById('q-txt').innerText = q.pergunta;
}

init();
</script>
</body>
</html>
