<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPA-10 CLOUD ULTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .view { display: none; }
        .active { display: block; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">

    <div class="max-w-md mx-auto w-full space-y-4 flex-grow">
        <header class="flex justify-between items-center px-2 py-4">
            <div>
                <h1 class="text-2xl font-900 tracking-tighter text-blue-500 italic">CPA10<span class="text-white">ULTRA</span></h1>
                <p id="voz-name" class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Sincronizando Voz...</p>
            </div>
            <div class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-bold text-gray-400">SUPABASE ON</span>
            </div>
        </header>

        <div id="dash" class="view active space-y-4">
            <div class="glass p-8 rounded-[40px] text-center shadow-2xl">
                <p class="text-[10px] text-blue-400 font-black uppercase tracking-[0.2em] mb-4">Meta Maratona 500</p>
                <div class="text-6xl font-900 mb-4 tracking-tighter" id="progresso-txt">0/0</div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="progresso-bar" class="bg-blue-500 h-full transition-all duration-1000 shadow-[0_0_15px_rgba(59,130,246,0.5)]" style="width: 0%"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-5 rounded-3xl">
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">Status Prova</p>
                    <p id="dash-timer-ref" class="text-xl font-bold text-yellow-500">180s / Questão</p>
                </div>
                <div class="glass p-5 rounded-3xl text-right">
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">ID Usuário</p>
                    <p class="text-xl font-bold text-white italic">Allisson</p>
                </div>
            </div>
        </div>

        <div id="prova" class="view space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black text-yellow-500 bg-yellow-500/10 px-3 py-1 rounded-full uppercase">Timer Real</span>
                <div id="timer" class="text-2xl font-black text-yellow-500 font-mono">180s</div>
            </div>
            <div class="glass p-8 rounded-[32px] min-h-[160px] flex items-center shadow-2xl border-l-4 border-blue-500">
                <p id="q-txt" class="text-lg font-bold leading-tight">Carregando simulado...</p>
            </div>
            <div id="opts-container" class="space-y-3"></div>
        </div>

        <div id="maratona" class="view space-y-6">
            <div class="glass p-12 rounded-[56px] text-center relative shadow-inner">
                <div id="pulse-ring" class="hidden absolute inset-0 rounded-[56px] border-4 border-blue-500/30 animate-ping"></div>
                <button onclick="toggleMaratona()" id="btn-maratona" class="btn-press relative z-10 w-28 h-28 bg-blue-600 rounded-full text-4xl shadow-[0_0_40px_rgba(37,99,235,0.4)] flex items-center justify-center mx-auto">
                    ▶️
                </button>
                <h2 class="mt-8 font-black text-2xl">Modo Direção</h2>
                <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest font-bold">5s de Reflexão entre P/R</p>
            </div>
            <div class="bg-blue-500/5 p-6 rounded-3xl border border-blue-500/10">
                <p id="current-q" class="text-center text-sm text-blue-300 font-medium leading-relaxed italic"></p>
            </div>
        </div>
    </div>

    <nav class="max-w-md mx-auto w-full glass p-4 rounded-[32px] flex justify-around mb-6 shadow-2xl border-t border-white/5">
        <button onclick="showView('dash')" class="btn-press p-2">📊</button>
        <button onclick="showView('prova')" class="btn-press p-2">🧪</button>
        <button onclick="showView('maratona')" class="btn-press p-2">🎧</button>
    </nav>

<script>
// CONFIGURAÇÃO SUPABASE - CHAVES ALLISSON
const SB_URL = "https://wfoysxuynbcuxybkqmfz.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmb3lzeHV5bmJjdXh5YmtxbWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3OTk3NDcsImV4cCI6MjA4ODM3NTc0N30.v28Tj6z6PrnyUk_kFSvvchjzwHmV7ZXcJH903hQTiZg";
const supabase = supabase.createClient(SB_URL, SB_KEY);

let app = {
    idx: 0,
    playing: false,
    questions: [],
    voice: null,
    userId: 'allisson'
};

// INICIALIZAR VOZ
function initVoice() {
    let voices = window.speechSynthesis.getVoices();
    app.voice = voices.find(v => (v.name.includes('Google') || v.name.includes('Microsoft')) && v.lang.includes('pt')) || voices[0];
    if(app.voice) document.getElementById('voz-name').innerText = app.voice.name;
}
window.speechSynthesis.onvoiceschanged = initVoice;

// CARREGAR DADOS CLOUD
async function init() {
    // 1. Pegar progresso
    const { data: prog } = await supabase.from('cpa10_progresso').select('maratona_idx').eq('user_id', app.userId).single();
    if(prog) app.idx = prog.maratona_idx;

    // 2. Pegar todas as questões
    const { data: qs } = await supabase.from('cpa10_maratona').select('*').order('id', { ascending: true });
    app.questions = qs || [];
    
    updateUI();
}

// MARATONA LOGIC
async function toggleMaratona() {
    app.playing = !app.playing;
    const btn = document.getElementById('btn-maratona');
    const ring = document.getElementById('pulse-ring');
    
    btn.innerText = app.playing ? "⏸️" : "▶️";
    if(app.playing) {
        ring.classList.remove('hidden');
        runMaratona();
    } else {
        ring.classList.add('hidden');
        window.speechSynthesis.cancel();
    }
}

async function runMaratona() {
    if(!app.playing || app.idx >= app.questions.length) return;

    let item = app.questions[app.idx];
    document.getElementById('current-q').innerText = item.pergunta;

    await speak(item.pergunta);
    
    // Pausa de 5s para o Allisson pensar na resposta enquanto dirige
    await new Promise(r => setTimeout(r, 5000));
    
    if(!app.playing) return;
    await speak("Resposta: " + item.resposta);
    
    app.idx++;
    // Sync Cloud
    await supabase.from('cpa10_progresso').update({ maratona_idx: app.idx }).eq('user_id', app.userId);
    
    updateUI();
    setTimeout(runMaratona, 2000);
}

function speak(text) {
    return new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(text);
        u.voice = app.voice;
        u.rate = 0.9;
        u.onend = resolve;
        window.speechSynthesis.speak(u);
    });
}

function updateUI() {
    const total = app.questions.length || 500;
    const pct = (app.idx / total) * 100;
    document.getElementById('progresso-bar').style.width = pct + "%";
    document.getElementById('progresso-txt').innerText = `${app.idx}/${total}`;
}

function showView(v) {
    document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
    document.getElementById(v).classList.add('active');
    if(v === 'prova') startSimulado();
}

// SIMULADO REALISTA (TIMER 180s)
function startSimulado() {
    // Aqui você pode carregar questões de uma tabela 'cpa10_simulado' se criar uma
    // Por enquanto, usaremos as do banco da maratona para teste
    if(app.questions.length === 0) return;
    
    let q = app.questions[Math.floor(Math.random() * app.questions.length)];
    document.getElementById('q-txt').innerText = q.pergunta;
    
    let t = 180;
    clearInterval(window.itv);
    window.itv = setInterval(() => {
        t--;
        document.getElementById('timer').innerText = t + "s";
        if(t <= 0) { clearInterval(window.itv); startSimulado(); }
    }, 1000);
}

init();
initVoice();
</script>
</body>
</html>
