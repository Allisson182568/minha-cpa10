<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPA-10 ULTRA - Allisson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .btn-audio { background: linear-gradient(135deg, #1db954 0%, #191414 100%); }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <header class="glass rounded-[2rem] p-8 text-center relative border-b-4 border-blue-600">
            <h1 class="text-[10px] font-black tracking-[0.4em] text-blue-500 uppercase mb-2">Transição de Carreira</h1>
            <div id="countdown" class="text-4xl font-black text-white tracking-tighter neon-text">--d --h --m</div>
            <p class="text-[9px] text-slate-500 mt-2 font-bold uppercase italic">Destino: Certificação ANBIMA</p>
        </header>

        <section class="glass rounded-[2rem] p-6 border border-blue-500/20">
            <div class="flex justify-between items-center mb-6">
                <span id="q-category" class="text-[9px] bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full font-black uppercase">Simulado Real</span>
                <span id="score-text" class="text-[10px] font-mono font-bold text-slate-400">SCORE: 0/0</span>
            </div>
            
            <div id="quiz-box">
                <p id="q-text" class="text-base font-bold leading-tight mb-8">Carregando banco de dados...</p>
                <div id="q-options" class="space-y-3"></div>
                
                <div id="q-explanation" class="hidden mt-6 p-4 bg-slate-800/50 rounded-2xl border border-white/5 text-[11px] leading-relaxed italic text-slate-300"></div>
                
                <button id="next-btn" class="hidden w-full mt-6 bg-white text-black font-black py-4 rounded-2xl text-[10px] uppercase tracking-[0.2em] transition hover:bg-blue-500 hover:text-white">Próximo Desafio</button>
            </div>
        </section>

        <section class="space-y-3">
            <h2 class="text-[10px] font-black text-slate-500 uppercase px-4 tracking-widest italic">Car Audio Mode - Playlists Reais</h2>
            <div class="grid grid-cols-1 gap-3">
                <a href="https://open.spotify.com/show/472aXpXf8O09zU89G1r4O6" target="_blank" class="btn-audio p-5 rounded-[1.5rem] flex items-center justify-between group transition-transform active:scale-95">
                    <div class="flex items-center space-x-4">
                        <span class="text-2xl">🎧</span>
                        <div>
                            <p class="text-xs font-black text-white uppercase">CPA-10 TopInvest</p>
                            <p class="text-[9px] text-white/60">Podcast completo no Spotify</p>
                        </div>
                    </div>
                    <span class="text-white/20 group-hover:text-white">▶</span>
                </a>

                <a href="https://www.youtube.com/playlist?list=PL_mN57A1BfGv-v8vAAmY-OsqP-I61XjX1" target="_blank" class="bg-red-600/10 border border-red-600/20 p-5 rounded-[1.5rem] flex items-center justify-between group active:scale-95">
                    <div class="flex items-center space-x-4">
                        <span class="text-2xl">📺</span>
                        <div>
                            <p class="text-xs font-black text-red-500 uppercase">Aulas Edgar Abreu</p>
                            <p class="text-[9px] text-red-500/60">Curso Completo (Playlist YT)</p>
                        </div>
                    </div>
                    <span class="text-red-500/20 group-hover:text-red-500">▶</span>
                </a>
            </div>
        </section>

        <section class="glass rounded-[2rem] p-6">
            <h3 class="text-[10px] font-black uppercase text-slate-500 mb-4">Milestones da Semana</h3>
            <div id="milestones" class="space-y-2">
                <label class="flex items-center p-3 rounded-xl hover:bg-white/5 transition cursor-pointer">
                    <input type="checkbox" class="task-check w-5 h-5 rounded-full border-slate-700 bg-transparent text-blue-600 focus:ring-0">
                    <span class="ml-3 text-xs font-medium">Módulo 1 e 2 (Sistema e Ética)</span>
                </label>
                <label class="flex items-center p-3 rounded-xl hover:bg-white/5 transition cursor-pointer">
                    <input type="checkbox" class="task-check w-5 h-5 rounded-full border-slate-700 bg-transparent text-blue-600 focus:ring-0">
                    <span class="ml-3 text-xs font-medium">Módulo 3 (Economia e Finanças)</span>
                </label>
            </div>
        </section>

    </div>

    <script>
        const targetDate = new Date("May 20, 2026 09:00:00").getTime();
        let correctCount = 0;
        let totalCount = 0;

        const questions = [
            { cat: "ECONOMIA", q: "Se o IPCA sobe além do esperado, qual a tendência da taxa Selic?", options: ["O Copom tende a elevar a Selic", "A Selic tende a cair", "A Selic permanece inalterada", "O IPCA não influencia a Selic"], correct: 0, why: "Juros altos freiam o consumo e controlam a inflação (IPCA)." },
            { cat: "INVESTIMENTOS", q: "Qual destes produtos possui garantia do FGC?", options: ["Debêntures", "Ações", "LCI", "Fundos de Ações"], correct: 2, why: "LCI, LCA, CDB e Poupança são cobertos pelo FGC até 250k." },
            { cat: "LAVAGEM DE DINHEIRO", q: "A fase de 'Integração' consiste em:", options: ["Colocar o dinheiro no sistema", "Dificultar o rastreio", "Trazer o dinheiro de volta com aparência lícita", "Trocar notas por moedas"], correct: 2, why: "Integração é a última fase, onde o dinheiro 'sujo' parece vir de negócios legítimos." },
            { cat: "ÉTICA", q: "O 'Chinese Wall' serve para:", options: ["Separar a gestão de recursos próprios da de terceiros", "Aumentar a segurança contra hackers", "Impedir a entrada de estrangeiros", "Pagar menos impostos"], correct: 0, why: "É a barreira de informação para evitar conflito de interesses no banco." },
            { cat: "FUNDOS", q: "O 'Come-Cotas' ocorre nos meses de:", options: ["Janeiro e Julho", "Maio e Novembro", "Dezembro", "Todo final de mês"], correct: 1, why: "Maio e Novembro são os meses da antecipação de IR nos fundos (exceto ações)." }
        ];

        // Timer
        setInterval(() => {
            const now = new Date().getTime();
            const d = targetDate - now;
            document.getElementById("countdown").innerHTML = `${Math.floor(d/(1000*60*60*24))}d ${Math.floor((d%(1000*60*60*24))/(1000*60*60))}h ${Math.floor((d%(1000*60*60))/(1000*60))}m`;
        }, 1000);

        // Quiz Engine
        function initQuiz() {
            const r = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('q-text').innerText = r.q;
            document.getElementById('q-category').innerText = r.cat;
            const optDiv = document.getElementById('q-options');
            const expDiv = document.getElementById('q-explanation');
            const nextBtn = document.getElementById('next-btn');
            
            optDiv.innerHTML = '';
            expDiv.classList.add('hidden');
            nextBtn.classList.add('hidden');

            r.options.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = "w-full text-left p-5 rounded-2xl bg-white/5 border border-white/10 text-[11px] font-bold transition-all duration-300 hover:border-blue-500";
                b.innerText = o;
                b.onclick = () => {
                    totalCount++;
                    const allBtns = optDiv.querySelectorAll('button');
                    allBtns.forEach(btn => btn.disabled = true);
                    
                    if(i === r.correct) {
                        b.classList.add('bg-blue-600', 'border-blue-500', 'text-white');
                        correctCount++;
                    } else {
                        b.classList.add('bg-red-600/40', 'border-red-500', 'text-red-200');
                        allBtns[r.correct].classList.add('bg-blue-600/40', 'border-blue-400');
                    }
                    
                    document.getElementById('score-text').innerText = `SCORE: ${correctCount}/${totalCount}`;
                    expDiv.innerHTML = `<strong>MASTER TIP:</strong> ${r.why}`;
                    expDiv.classList.remove('hidden');
                    nextBtn.classList.remove('hidden');
                };
                optDiv.appendChild(b);
            });
        }

        document.getElementById('next-btn').onclick = initQuiz;
        initQuiz();
    </script>
</body>
</html>
