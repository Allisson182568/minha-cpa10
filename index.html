<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA-10 PRO - Allisson</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#020617; color:#f8fafc; font-family: sans-serif; }
.glass { background: rgba(15,23,42,.8); backdrop-filter: blur(10px); }
</style>
</head>

<body class="p-4 space-y-4">

<div class="max-w-md mx-auto space-y-4">

<!-- HEADER -->
<div class="glass p-6 rounded-2xl text-center">
<h1 class="text-xs text-blue-400 font-bold">CPA-10 PRO</h1>
<div id="countdown" class="text-2xl font-black">--</div>
<button onclick="installApp()" class="mt-2 text-xs bg-green-600 px-3 py-1 rounded">Instalar App</button>
</div>

<!-- QUIZ -->
<div class="glass p-6 rounded-2xl">
<div class="flex justify-between text-xs mb-2">
<span id="cat"></span>
<span id="timer">20s</span>
</div>

<div id="q" class="font-bold mb-4"></div>
<div id="opts" class="space-y-2"></div>

<div id="exp" class="hidden mt-4 text-xs"></div>

<button id="next" onclick="nextQ()" class="hidden mt-4 w-full bg-white text-black py-2 rounded">Próximo</button>
</div>

<!-- DASHBOARD -->
<div class="glass p-6 rounded-2xl">
<h2 class="text-xs mb-2">Desempenho</h2>
<canvas id="chart"></canvas>
</div>

<!-- AUDIO -->
<div class="glass p-4 rounded-2xl">
<button onclick="speak()" class="w-full bg-blue-600 py-2 rounded">🔊 Ouvir pergunta</button>
</div>

<!-- LINKS -->
<div class="glass p-4 rounded-2xl space-y-2 text-xs">
<a href="https://open.spotify.com/show/472aXpXf8O09zU89G1r4O6" target="_blank">🎧 Podcast CPA-10</a><br>
<a href="https://www.youtube.com/playlist?list=PL_mN57A1BfGv-v8vAAmY-OsqP-I61XjX1" target="_blank">📺 Curso completo</a>
</div>

</div>

<script>
// ====== CONFIG ======
const targetDate = new Date("May 20, 2026 09:00").getTime();

// ====== BANCO BASE ======
const baseQuestions = [
{cat:"ECONOMIA",q:"Se o IPCA sobe?",o:["Selic sobe","Selic cai","Nada muda","Não influencia"],c:0,w:"Inflação alta → BC sobe juros"},
{cat:"FGC",q:"Qual tem FGC?",o:["Ações","LCI","Debênture","FII"],c:1,w:"LCI tem garantia até 250k"}
];

// ====== GERADOR (300+) ======
function generateQuestions(){
let arr=[...baseQuestions];
const temas=["Selic","IPCA","FGC","Fundos","Ética"];

for(let i=0;i<300;i++){
arr.push({
cat:temas[i%temas.length],
q:`Questão ${i}: Conceito sobre ${temas[i%temas.length]}?`,
o:["Opção A","Opção B","Opção C","Opção D"],
c:Math.floor(Math.random()*4),
w:"Explicação automática"
});
}
return arr;
}

const questions = generateQuestions();

// ====== STATE ======
let current;
let score=0,total=0;
let wrong = JSON.parse(localStorage.getItem("wrong")||"[]");

// ====== QUIZ ======
function getQ(){
if(wrong.length && Math.random()<0.4){
return wrong[Math.floor(Math.random()*wrong.length)];
}
return questions[Math.floor(Math.random()*questions.length)];
}

function load(){
current = getQ();
document.getElementById("q").innerText=current.q;
document.getElementById("cat").innerText=current.cat;

const opts=document.getElementById("opts");
opts.innerHTML="";
current.o.forEach((op,i)=>{
let b=document.createElement("button");
b.className="w-full bg-white/10 p-2 rounded text-xs";
b.innerText=op;
b.onclick=()=>answer(i);
opts.appendChild(b);
});
startTimer();
}

function answer(i){
total++;
if(i===current.c){
score++;
}else{
wrong.push(current);
localStorage.setItem("wrong",JSON.stringify(wrong));
}
document.getElementById("exp").classList.remove("hidden");
document.getElementById("exp").innerText=current.w;
document.getElementById("next").classList.remove("hidden");
drawChart();
}

function nextQ(){
document.getElementById("exp").classList.add("hidden");
document.getElementById("next").classList.add("hidden");
load();
}

// ====== TIMER ======
let t=20,interval;
function startTimer(){
clearInterval(interval);
t=20;
interval=setInterval(()=>{
t--;
document.getElementById("timer").innerText=t+"s";
if(t<=0){
clearInterval(interval);
answer(-1);
}
},1000);
}

// ====== AUDIO ======
function speak(){
let u=new SpeechSynthesisUtterance(current.q);
speechSynthesis.speak(u);
}

// ====== DASHBOARD ======
function drawChart(){
let c=document.getElementById("chart");
let ctx=c.getContext("2d");
c.width=300;c.height=150;

ctx.clearRect(0,0,300,150);
let pct = total?score/total:0;

ctx.fillRect(10,100,200*pct,20);
ctx.fillText("Score: "+Math.round(pct*100)+"%",10,90);
}

// ====== COUNTDOWN ======
setInterval(()=>{
let d=targetDate-Date.now();
document.getElementById("countdown").innerText=
Math.floor(d/86400000)+"d";
},1000);

// ====== PWA INSTALL ======
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
deferredPrompt = e;
});

function installApp(){
if(deferredPrompt){
deferredPrompt.prompt();
}
}

// ====== SERVICE WORKER ======
if('serviceWorker' in navigator){
const swBlob = new Blob([`
self.addEventListener('install', e=>{
self.skipWaiting();
});
self.addEventListener('fetch', e=>{
e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
});
`],{type:'text/javascript'});

navigator.serviceWorker.register(URL.createObjectURL(swBlob));
}

// START
load();
</script>

</body>
</html>
